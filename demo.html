<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>My Custom Website</title>
  <meta name="title" content="My Custom Website">
  <meta name="description" content="Welcome to my personal website. Explore projects, updates, and more.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourwebsite.com/">

  <!-- Favicon System -->
  <link rel="icon" type="image/webp" sizes="32x32" href="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <link rel="icon" type="image/webp" sizes="16x16" href="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <link rel="shortcut icon" href="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <link rel="apple-touch-icon" sizes="152x152" href="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <link rel="apple-touch-icon" sizes="120x120" href="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <meta name="msapplication-TileImage" content="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <meta name="msapplication-TileColor" content="#111111">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourwebsite.com/">
  <meta property="og:title" content="My Custom Website">
  <meta property="og:description" content="Welcome to my personal website. Explore projects, updates, and more.">
  <meta property="og:image" content="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:site_name" content="My Custom Website">
  <meta property="og:locale" content="en_US">

  <!-- X (Twitter) Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Custom Website">
  <meta name="twitter:description" content="Welcome to my personal website. Explore projects, updates, and more.">
  <meta name="twitter:image" content="https://cdn.imgpile.com/f/coWqJDm_lg.webp">
  <meta name="twitter:image:alt" content="Website preview image">

  <meta name="theme-color" content="#111111">
</head>

<body style="font-family: Arial, sans-serif; background-color: #111; color: #eee; margin: 0; padding: 40px; line-height: 1.6;">

  <div style="max-width: 700px; margin: 0 auto;">
    <h1 style="color: #4da6ff;">My Custom Website</h1>

    <p>
      Welcome to my personal website. This is a clean and simple space for sharing projects, thoughts, and updates.
    </p>

    <!-- Your Image -->
    <img src="https://cdn.imgpile.com/f/coWqJDm_lg.webp" 
         alt="Preview Image" 
         style="max-width: 100%; height: auto; border-radius: 10px; margin: 25px 0; display: block;">

    <p>
      Feel free to explore and check back for new content.
    </p>

    <hr style="border: 1px solid #333; margin: 30px 0;">

    <p style="font-size: 14px; color: #888;">
      © 2026 My Custom Website
    </p>
  </div>

</body>
</html>
